name: IB Build YK-L1c 16M USB+Print+Samba
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Download ImageBuilder ImmortalWrt 24.10.6 ramips/mt7620
        run: |
          wget https://downloads.immortalwrt.org/releases/24.10.6/targets/ramips/mt7620/immortalwrt-imagebuilder-24.10.6-ramips-mt7620.Linux-x86_64.tar.xz
          tar -xf immortalwrt-imagebuilder-24.10.6-ramips-mt7620.Linux-x86_64.tar.xz
          mv immortalwrt-imagebuilder-24.10.6-ramips-mt7620.Linux-x86_64 ib
      - name: Build firmware
        working-directory: ./ib
        run: |
          make image PROFILE=youku_yk-l1c \
          PACKAGES="\
          kmod-usb-core kmod-usb-ohci kmod-usb2 \
          kmod-usb-storage kmod-scsi-core kmod-usb-storage-uas \
          kmod-usb-printer p910nd luci-app-p910nd \
          block-mount kmod-fs-vfat kmod-fs-ext4 kmod-fs-ntfs3 \
          kmod-nls-cp437 kmod-nls-iso8859-1 kmod-nls-utf8 \
          usbutils blkid \
          luci luci-compat luci-mod-admin-full \
          luci-app-samba4 \
          wpad-mini \
          " \
          FILES=files \
          DISABLED_SERVICES=""
      - name: Upload bin
        uses: actions/upload-artifact@v4
        with:
          name: YK-L1c-24.10.6-IB-USB-Print-Samba
          path: ib/bin/targets/ramips/mt7620/*.bin
