name: Build ImmortalWrt 24.10 YK-L1c 16M
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Debug mode'
        required: false
        default: 'false'
  push:
    branches:
      - master
    paths:
      - '.config'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
      - '.github/workflows/build-openwrt.yml'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v24.10.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  SRC_DIR: /workdir/openwrt

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2204)
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt

      - name: Load custom feeds & Run diy-part1.sh
        working-directory: ${{ env.SRC_DIR }}
        run: |
          [ -e $GITHUB_WORKSPACE/$FEEDS_CONF ] && cp $GITHUB_WORKSPACE/$FEEDS_CONF feeds.conf.default
          chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH
          $GITHUB_WORKSPACE/$DIY_P1_SH

      - name: Update feeds
        working-directory: ${{ env.SRC_DIR }}
        run: |
          ./scripts/feeds update -a

      - name: Install feeds
        working-directory: ${{ env.SRC_DIR }}
        run: |
          ./scripts/feeds install -a

      - name: Load custom configuration & Run diy-part2.sh
        working-directory: ${{ env.SRC_DIR }}
        run: |
          [ -d $GITHUB_WORKSPACE/files ] && cp -r $GITHUB_WORKSPACE/files ./
          [ -e $GITHUB_WORKSPACE/$CONFIG_FILE ] && cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
          chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: Download package
        working-directory: ${{ env.SRC_DIR }}
        run: |
          make download -j8

      - name: Compile firmware
        working-directory: ${{ env.SRC_DIR }}
        run: |
          make -j$(nproc) || make -j2 || make -j1 V=s

      - name: Upload firmware artifact
        uses: actions/upload-artifact@main
        with:
          name: ImmortalWrt-24.10-YK-L1c-16M-USB-Print-Samba
          path: ${{ env.SRC_DIR }}/bin/targets/*/*/*.bin

      - name: Upload to Release
        uses: softprops/action-gh-release@master
        if: env.GITHUB_TOKEN != '' && env.UPLOAD_RELEASE == 'true' && !cancelled()
        with:
          tag_name: auto-${{ github.run_number }}
          files: ${{ env.SRC_DIR }}/bin/targets/*/*/*.bin
